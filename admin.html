<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de tarifários</title>
  <style>
    :root { --ink:#14213d; --muted:#72809a; --line:#dde5f0; --blue:#246bfe; --surface:#fff; --canvas:#f4f7fb; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:Inter,"Segoe UI",sans-serif; }
    .top { background:var(--ink); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
    .top h1 { margin:0; font-size:18px; }
    main { width:min(1180px,calc(100% - 32px)); margin:24px auto 60px; }
    .panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
    .auth { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; }
    label { display:flex; flex-direction:column; gap:5px; color:#40516f; font-size:12px; font-weight:800; }
    input, select { width:100%; height:40px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff; color:var(--ink); }
    button { height:40px; border:0; border-radius:8px; padding:0 14px; background:var(--blue); color:#fff; font-weight:800; cursor:pointer; }
    button.secondary { background:#edf2f8; color:var(--ink); }
    button.danger { background:#fff; color:var(--danger); border:1px solid #f1b8b3; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .card { border:1px solid var(--line); border-radius:12px; padding:14px; background:#fff; }
    .card h3 { margin:0 0 12px; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
    .services { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; }
    .services label { flex-direction:row; align-items:center; }
    .services input { width:16px; height:16px; }
    .customer-options { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; }
    .customer-options label { flex-direction:row; align-items:center; }
    .customer-options input { width:16px; height:16px; }
    .tab-options { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; }
    .tab-options label { flex-direction:row; align-items:center; }
    .tab-options input { width:16px; height:16px; }
    .card-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
    .status { min-height:20px; margin-top:10px; color:var(--muted); font-size:13px; }
    .status.error { color:var(--danger); }
    .admin-tabs { display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--line); }
    .admin-tab { height:42px; border:0; border-bottom:3px solid transparent; border-radius:0; background:transparent; color:var(--muted); }
    .admin-tab.active { border-bottom-color:var(--blue); color:var(--blue); }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .design-layout { display:grid; grid-template-columns:290px minmax(0,1fr); gap:14px; }
    .design-controls { display:flex; flex-direction:column; gap:10px; }
    .preview-frame { width:100%; height:720px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .selected-element { border:1px solid var(--line); border-radius:8px; background:#fbfdff; padding:10px; color:var(--muted); font-size:12px; }
    @media(max-width:900px){ .design-layout { grid-template-columns:1fr; } .preview-frame { height:620px; } }
    @media(max-width:800px){ .auth,.cards { grid-template-columns:1fr; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <div class="top"><h1>Editor de tarifários</h1><a href="./" style="color:#fff">Ver website</a></div>
  <main>
    <section class="panel">
      <div class="auth">
        <label>Repositório<input id="repo" value="fabriciod15/comparador-telecomunicacoes-portugal" readonly></label>
        <label>Estado da sessão<input id="session-status" value="Não autenticado" readonly></label>
        <button id="login">Entrar com GitHub</button>
      </div>
      <div class="status" id="status"></div>
    </section>
    <section class="panel">
      <div class="admin-tabs">
        <button class="admin-tab active" type="button" data-admin-tab="tariffs">Tarifários</button>
        <button class="admin-tab" type="button" data-admin-tab="design">Design</button>
      </div>
      <div class="tab-content active" id="tab-tariffs">
        <div class="toolbar"><strong id="count">0 tarifários</strong><button id="add">Adicionar tarifário</button></div>
        <div class="cards" id="cards"></div>
        <div class="toolbar" style="justify-content:flex-end;margin:16px 0 0"><button class="secondary" id="save-local">Guardar alterações locais</button><button id="save-github">Publicar no GitHub</button></div>
      </div>
      <div class="tab-content" id="tab-design">
        <div class="design-layout">
          <aside class="design-controls">
            <strong>Editar visualmente</strong>
            <div class="selected-element" id="selected-element">Clica num elemento na pré-visualização.</div>
            <label>Texto selecionado<textarea id="selected-text" rows="4" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px"></textarea></label>
            <label>Cor do texto<input id="selected-color" type="color" value="#14213d"></label>
            <label>Cor de fundo<input id="selected-background" type="color" value="#ffffff"></label>
            <button id="apply-design" type="button">Aplicar na pré-visualização</button>
            <button class="secondary" id="reload-preview" type="button">Recarregar website</button>
            <button id="publish-design" type="button">Publicar design</button>
          </aside>
          <iframe class="preview-frame" id="design-preview" title="Pré-visualização do website"></iframe>
        </div>
      </div>
    </section>
  </main>
  <script>
    const operatorNames = ["Amigo","DIGI","MEO","Moche","NOS","UZO","Vodafone","WOO","WTF","Yorn"];
    let tariffs = [];
    let sha = null;

    function status(message, error=false) {
      const node = document.getElementById("status");
      node.textContent = message;
      node.className = "status" + (error ? " error" : "");
    }

    function numberField(label, key, value) {
      return `<label>${label}<input type="number" step="any" data-key="${key}" value="${value ?? 0}"></label>`;
    }

    function textField(label, key, value) {
      return `<label>${label}<input type="text" data-key="${key}" value="${String(value ?? "").replace(/"/g,"&quot;")}"></label>`;
    }

    function inferTabs(item) {
      const services = Array.isArray(item.servicos) ? item.servicos : [];
      const tabs = [];
      if (item.categoria === "MOVEL" || services.includes("MOVEL") && services.length === 1) tabs.push("MOVEL");
      if (services.includes("NET") && services.length === 1) tabs.push("NET");
      if (services.includes("NET") && services.includes("MOVEL") && services.length === 2) tabs.push("NET_MOVEL");
      if (services.includes("TV") && services.includes("NET") && services.includes("VOZ") && !services.includes("MOVEL")) tabs.push("TV_NET_VOZ");
      if (services.includes("TV") && services.includes("NET") && services.includes("VOZ") && services.includes("MOVEL")) tabs.push("TV_NET_VOZ_MOVEL");
      return tabs;
    }

    function render() {
      document.getElementById("count").textContent = `${tariffs.length} tarifário${tariffs.length === 1 ? "" : "s"}`;
      document.getElementById("cards").innerHTML = tariffs.map((item,index) => `
        <article class="card" data-index="${index}">
          <h3>${index + 1}. ${item.nome || "Novo tarifário"}</h3>
          <div class="grid">
            ${textField("Nome do tarifário","nome",item.nome)}
            ${textField("Tipo","tipo",item.tipo)}
            ${textField("Link do tarifário","fonte",item.fonte)}
            <label>Operadora<select data-key="operadora">${operatorNames.map(name => `<option ${item.operadora===name?"selected":""}>${name}</option>`).join("")}</select></label>
            <label>Categoria<select data-key="categoria"><option ${item.categoria==="CASA"?"selected":""}>CASA</option><option ${item.categoria==="MOVEL"?"selected":""}>MOVEL</option></select></label>
            ${numberField("Fibra Mbps","fibra_mbps",item.fibra_mbps)}
            ${numberField("Canais TV","tv_canais",item.tv_canais)}
            ${numberField("Cartões móveis","cartoes_moveis",item.cartoes_moveis)}
            ${numberField("Dados nacionais GB","dados_gb",item.dados_gb)}
            ${textField("Dados roaming UE","dados_roaming",item.dados_roaming)}
            ${textField("Minutos","minutos",item.minutos)}
            ${textField("SMS","sms",item.sms)}
            ${numberField("Fidelização meses","fidelizacao_meses",item.fidelizacao_meses)}
            ${numberField("Mensalidade base","mensalidade_base",item.mensalidade_base)}
            ${numberField("Mensalidade promo","mensalidade_promo",item.mensalidade_promo)}
            ${numberField("Meses promo","meses_promo",item.meses_promo)}
            ${numberField("Instalação","custo_instalacao",item.custo_instalacao)}
            ${numberField("Oferta/voucher","oferta_voucher",item.oferta_voucher)}
            <div class="services"><strong>Serviços</strong>${["NET","TV","VOZ","MOVEL"].map(service => `<label><input type="checkbox" data-service="${service}" ${item.servicos?.includes(service)?"checked":""}> ${service}</label>`).join("")}</div>
            <div class="tab-options"><strong>Abas onde aparece</strong>${[
              ["MOVEL","Móvel"],
              ["NET","Net"],
              ["NET_MOVEL","Net + Móvel"],
              ["TV_NET_VOZ","TV + Net + Voz"],
              ["TV_NET_VOZ_MOVEL","TV + Net + Voz + Móvel"]
            ].map(([aba,nome]) => {
              const selectedTabs = item.abas?.length ? item.abas : inferTabs(item);
              return `<label><input type="checkbox" data-aba="${aba}" ${selectedTabs.includes(aba)?"checked":""}> ${nome}</label>`;
            }).join("")}</div>
            <div class="customer-options"><strong>Tipo de cliente</strong>${[
              ["TODOS","Novos e atuais clientes"],
              ["NOVOS","Novos clientes"],
              ["ATUAIS","Clientes atuais"]
            ].map(([tipo,nome]) => {
              const clientes = item.clientes || ["NOVOS","ATUAIS"];
              const checked = tipo==="TODOS"
                ? clientes.includes("NOVOS") && clientes.includes("ATUAIS")
                : clientes.length===1 && clientes.includes(tipo);
              return `<label><input type="radio" name="clientes-${index}" data-cliente="${tipo}" ${checked?"checked":""}> ${nome}</label>`;
            }).join("")}</div>
          </div>
          <div class="card-actions"><button class="danger" data-delete="${index}">Eliminar</button></div>
        </article>
      `).join("");
    }

    function collect() {
      document.querySelectorAll(".card").forEach(card => {
        const index = Number(card.dataset.index);
        [...card.querySelectorAll("[data-key]")].forEach(field => {
          const value = field.value;
          const numberFields = ["fibra_mbps","tv_canais","cartoes_moveis","dados_gb","fidelizacao_meses","mensalidade_base","mensalidade_promo","meses_promo","custo_instalacao","oferta_voucher"];
          tariffs[index][field.dataset.key] = numberFields.includes(field.dataset.key) ? Number(value) : value;
        });
        tariffs[index].servicos = [...card.querySelectorAll("[data-service]:checked")].map(field => field.dataset.service);
        tariffs[index].abas = [...card.querySelectorAll("[data-aba]:checked")].map(field => field.dataset.aba);
        const selected = card.querySelector("[data-cliente]:checked")?.dataset.cliente || "TODOS";
        tariffs[index].clientes = selected==="TODOS" ? ["NOVOS","ATUAIS"] :
          selected==="NOVOS" ? ["NOVOS"] : ["ATUAIS"];
      });
    }

    async function loadFromGitHub() {
      const repo = document.getElementById("repo").value.trim();
      status("A abrir...");
      try {
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/tarifarios.json`);
        if (!response.ok) throw new Error("Não foi possível abrir tarifarios.json");
        const data = await response.json();
        sha = data.sha;
        const bytes = Uint8Array.from(atob(data.content.replace(/\n/g,"")), char => char.charCodeAt(0));
        tariffs = JSON.parse(new TextDecoder().decode(bytes));
        render();
        status(`${tariffs.length} tarifários carregados.`);
      } catch (error) { status(error.message, true); }
    }

    async function saveToGitHub() {
      collect();
      status("A publicar...");
      try {
        const response = await fetch("/api/save", {
          method:"PUT",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify(tariffs)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || data.message || "Não foi possível publicar");
        status("Publicação concluída. O GitHub Pages será atualizado automaticamente.");
      } catch (error) { status(error.message, true); }
    }

    async function checkSession() {
      const response = await fetch("/api/me");
      if (response.ok) {
        const data = await response.json();
        document.getElementById("session-status").value = `Autenticado como ${data.login}`;
        document.getElementById("login").textContent = "Terminar sessão";
        await loadFromGitHub();
      } else {
        document.getElementById("session-status").value = "Não autenticado";
        document.getElementById("login").textContent = "Entrar com GitHub";
      }
    }

    document.getElementById("login").addEventListener("click", () => {
      fetch("/api/me").then(response => {
        location.href = response.ok ? "/api/logout" : "/api/auth/login";
      });
    });
    document.getElementById("add").addEventListener("click", () => {
      collect();
      tariffs.push({ categoria:"CASA",servicos:["NET"],abas:["NET"],clientes:["NOVOS","ATUAIS"],operadora:"DIGI",tipo:"",nome:"Novo tarifário",fonte:"",fibra_mbps:0,tv_canais:0,cartoes_moveis:0,dados_gb:0,dados_roaming:"—",minutos:"—",sms:"—",fidelizacao_meses:0,mensalidade_base:0,mensalidade_promo:0,meses_promo:0,custo_instalacao:0,oferta_voucher:0 });
      render();
    });
    document.getElementById("cards").addEventListener("click", event => {
      if (!event.target.dataset.delete) return;
      collect();
      tariffs.splice(Number(event.target.dataset.delete),1);
      render();
    });
    document.getElementById("save-local").addEventListener("click", () => {
      collect();
      localStorage.setItem("tarifarios-editor",JSON.stringify(tariffs));
      status("Alterações guardadas neste browser.");
    });
    document.getElementById("save-github").addEventListener("click", saveToGitHub);
    document.querySelectorAll("[data-admin-tab]").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll("[data-admin-tab]").forEach(button => button.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(content => content.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("tab-" + tab.dataset.adminTab).classList.add("active");
      });
    });

    async function loadDesignPreview() {
      const frame = document.getElementById("design-preview");
      const publicUrl = "https://fabriciod15.github.io/comparador-telecomunicacoes-portugal/";
      try {
        const response = await fetch(publicUrl + "?preview=" + Date.now());
        if (!response.ok) throw new Error("Não foi possível abrir a pré-visualização");
        const html = await response.text();
        frame.srcdoc = '<base href="' + publicUrl + '">' + html;
      } catch (error) {
        status(error.message, true);
      }
    }

    document.getElementById("reload-preview").addEventListener("click", loadDesignPreview);

    let selectedPreviewElement = null;
    let designRules = [];

    async function loadDesignConfig() {
      try {
        const response = await fetch("design.json?v=" + Date.now());
        if (response.ok) {
          const config = await response.json();
          designRules = config.rules || [];
        }
      } catch {}
    }

    function previewSelector(element) {
      if (element.id) return "#" + element.id;
      if (element.className && typeof element.className === "string") {
        const first = element.className.trim().split(/\s+/)[0];
        if (first) return "." + first;
      }
      return element.tagName.toLowerCase();
    }

    document.getElementById("apply-design").addEventListener("click", () => {
      const frame = document.getElementById("design-preview");
      const frameDocument = frame.contentDocument;
      if (!frameDocument) return;
      if (!selectedPreviewElement) {
        status("Seleciona primeiro um elemento na pré-visualização.", true);
        return;
      }
      selectedPreviewElement.textContent = document.getElementById("selected-text").value;
      selectedPreviewElement.style.color = document.getElementById("selected-color").value;
      selectedPreviewElement.style.backgroundColor = document.getElementById("selected-background").value;
      const rule = {
        selector: previewSelector(selectedPreviewElement),
        text: document.getElementById("selected-text").value,
        color: document.getElementById("selected-color").value,
        background: document.getElementById("selected-background").value
      };
      designRules = designRules.filter(item => item.selector !== rule.selector);
      designRules.push(rule);
    });

    document.getElementById("publish-design").addEventListener("click", async () => {
      status("A publicar design...");
      try {
        const response = await fetch("/api/save-design", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rules: designRules })
        });
        if (!response.ok) throw new Error((await response.json()).error || "Não foi possível publicar");
        status("Design publicado com sucesso.");
      } catch (error) {
        status(error.message, true);
      }
    });

    document.getElementById("design-preview").addEventListener("load", () => {
      const frame = document.getElementById("design-preview");
      const frameDocument = frame.contentDocument;
      if (!frameDocument) return;
      frameDocument.querySelectorAll("h1,h2,p,a,button,span,.tab-btn,.brand").forEach(element => {
        element.style.cursor = "pointer";
        element.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          selectedPreviewElement = element;
          document.getElementById("selected-element").textContent =
            `${element.tagName.toLowerCase()}${element.className ? "." + String(element.className).split(" ").join(".") : ""}`;
          document.getElementById("selected-text").value = element.textContent.trim();
          const style = frameDocument.defaultView.getComputedStyle(element);
          document.getElementById("selected-color").value = rgbToHex(style.color);
          document.getElementById("selected-background").value = rgbToHex(style.backgroundColor);
        });
      });
    });

    function rgbToHex(color) {
      const values = color.match(/\d+/g);
      if (!values) return "#ffffff";
      if (values.length < 3) return "#ffffff";
      return "#" + values.slice(0,3).map(value =>
        Number(value).toString(16).padStart(2,"0")
      ).join("");
    }
    checkSession();
    loadDesignConfig();
    loadDesignPreview();
  </script>
</body>
</html>
